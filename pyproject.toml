[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "aerion"
dynamic = ["version"]
description = "AERION - Advanced Computational Aerodynamics Platform. Engineering the Invisible."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The AERION Authors" }]
keywords = ["CFD", "aerodynamics", "finite volume", "Navier-Stokes", "wind tunnel"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
aerion = "aerion.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.22"
cmake.build-type = "Release"
wheel.packages = ["python/aerion"]
sdist.exclude = ["build/", ".github/"]

[tool.scikit-build.cmake.define]
AERION_BUILD_PYTHON = "ON"
AERION_PYTHON_INPLACE = "OFF"
AERION_BUILD_TESTS = "OFF"
AERION_BUILD_APPS = "OFF"
AERION_BUILD_BENCHMARKS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(\s*AERION\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
