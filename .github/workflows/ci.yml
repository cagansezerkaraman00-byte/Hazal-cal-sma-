name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Configure
        run: cmake --preset ci -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Verification study (order of accuracy)
        run: |
          PYTHONPATH=build/ci/python python -m aerion verify poisson --levels 16 32 64 128
          PYTHONPATH=build/ci/python python -m aerion verify poisson --levels 16 32 64 128 --beta 2

  sanitizers:
    name: Linux ASan/UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt ninja
      - name: Configure
        shell: bash
        run: cmake --preset release -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  wheel:
    name: Python package (pip install .)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install
        run: python -m pip install . pytest
      - name: Test installed package
        run: |
          cd "$RUNNER_TEMP"
          aerion info
          python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -p no:cacheprovider
