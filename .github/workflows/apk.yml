# Luna'nın Android uygulamasını (APK) derler, imzasını doğrular, her derlemeyi kendi GitHub sürümüne koyar
# (telefondan doğrudan indirilebilsin) ve bir Android emülatöründe açıp ekran görüntüsü alır.
# Luna'nın kendi dosyalarına dokunmaz: apk/scripts/web.cjs onları uygulamanın içine kopyalar.
# LUNA_IMZA_ANAHTARI (anahtar dosyası, base64) ve LUNA_IMZA_SIFRESI sırları tanımlıysa kalıcı anahtarla imzalı
# luna.apk (Hazal'ın tableti için) de çıkar; yoksa yalnızca luna-deneme.apk çıkar. Anahtar depoya asla girmez.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sürüm
        run: |
          V=$(node -e "const s=require('fs').readFileSync('js/surum.js','utf8');console.log(JSON.parse(s.match(/\/\*SURUMLER\*\/([\s\S]*?)\/\*SURUMLER\*\//)[1])[0].surum)")
          echo "LUNA_SURUM=$V" >> "$GITHUB_ENV"
          echo "LUNA_SURUM_KODU=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Luna'yı uygulamaya kopyala
        working-directory: apk
        run: |
          npm ci --no-audit --no-fund
          npm run sync
      - name: Derle
        working-directory: apk/android
        env:
          LUNA_IMZA_ANAHTARI: ${{ secrets.LUNA_IMZA_ANAHTARI }}
          LUNA_IMZA_SIFRESI: ${{ secrets.LUNA_IMZA_SIFRESI }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../cikti
          cp app/build/outputs/apk/debug/app-debug.apk ../../cikti/luna-deneme.apk
          if [ -n "$LUNA_IMZA_ANAHTARI" ] && [ -n "$LUNA_IMZA_SIFRESI" ]; then
            export LUNA_IMZA_DOSYASI="$RUNNER_TEMP/luna-imza.p12"
            printf '%s' "$LUNA_IMZA_ANAHTARI" | base64 -d > "$LUNA_IMZA_DOSYASI"
            ./gradlew --no-daemon assembleRelease
            rm -f "$LUNA_IMZA_DOSYASI"
            cp app/build/outputs/apk/release/app-release.apk ../../cikti/luna.apk
          else
            echo "İmza sırları yok: yalnızca deneme APK'sı çıktı"
          fi
          ls -la ../../cikti

      - name: İmzaları Android'in kendi aracıyla doğrula
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for f in cikti/*.apk; do
            echo "== $f"
            "$AS" verify --verbose --print-certs "$f" > imza.txt 2>&1 || { cat imza.txt; echo "İMZA DOĞRULANAMADI: $f"; exit 1; }
            grep -E "^Verified|Signer #1 certificate (DN|SHA-256)" imza.txt
          done

      # Her derleme kendi sürüm sayfasına konur; bağlantı indirme sırasında asla silinmez.
      # Kalıcı bağlantı: https://github.com/<depo>/releases/latest/download/luna.apk (en yeni tamamlanmış derleme)
      - name: Sürüm sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$LUNA_SURUM_KODU"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          NOT="Luna $LUNA_SURUM · derleme $LUNA_SURUM_KODU · $(git log -1 --format=%h)
          luna.apk: kalıcı anahtarla imzalı; Hazal'ın tableti ve senin telefonun için.
          luna-deneme.apk: deneme anahtarıyla imzalı; kurma."
          gh release create "$TAG" cikti/*.apk --latest --target "$GITHUB_SHA" --title "Luna APK $LUNA_SURUM (derleme $LUNA_SURUM_KODU)" --notes "$NOT"
          # eski derlemelerden son 3'ü kalsın
          gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -E '^apk-[0-9]+$' | tail -n +4 | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true

      - name: Emülatöre izin (KVM)
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç
        continue-on-error: true
        timeout-minutes: 20
        run: |
          SDK="$ANDROID_HOME"; export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME" # avdmanager ile emülatör aynı yere baksın
          ls -la /dev/kvm || echo "KVM yok"
          echo "== $(date +%T) sistem görüntüsü iniyor"
          yes | timeout 600 "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > sdk.log 2>&1 || { tail -20 sdk.log; exit 1; }
          echo "== $(date +%T) emülatör kuruluyor"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n luna -k "system-images;android-35;google_apis;x86_64" -d pixel_6
          emulator -avd luna -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
          echo "== $(date +%T) emülatör açılıyor"
          timeout 300 adb wait-for-device || { echo "emülatör bağlanmadı"; tail -40 emulator.log; exit 1; }
          for i in $(seq 1 150); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done
          echo "== $(date +%T) açıldı: $(adb shell getprop sys.boot_completed)"
          set +e
          APK=cikti/luna.apk; [ -f "$APK" ] || APK=cikti/luna-deneme.apk
          echo "== kuruluyor: $APK"; adb install -r "$APK"
          adb logcat -c
          adb logcat -v time > cikti/gunluk.txt 2>&1 & # emülatör çökse de günlük kalsın
          adb shell am start -n com.hazal.luna/.MainActivity
          sleep 25
          adb exec-out screencap -p > cikti/ekran-telefon.png
          sleep 5
          echo "== Luna'nın günlüğü (konsol ve hatalar)"
          grep -E "Capacitor/Console|Luna APK|AndroidRuntime|FATAL|chromium.*(Uncaught|Error)" cikti/gunluk.txt | tail -150
          exit 0
      - name: Ekran görüntülerini sürüm sayfasına ekle
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in cikti/ekran-*.png; do [ -s "$f" ] && gh release upload "$TAG" "$f" --clobber; done || echo "ekran görüntüsü yok"
      - name: Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-apk
          path: cikti/
