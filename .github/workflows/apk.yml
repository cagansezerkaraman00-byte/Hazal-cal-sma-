# Luna'nın Android uygulamasını (APK) derler, bir Android emülatöründe açıp ekran görüntüsü alır ve
# "apk-son" GitHub sürümüne koyar (telefondan doğrudan indirilebilsin).
# Luna'nın kendi dosyalarına dokunmaz: apk/scripts/web.cjs onları uygulamanın içine kopyalar.
# LUNA_IMZA_ANAHTARI (anahtar dosyası, base64) ve LUNA_IMZA_SIFRESI sırları tanımlıysa kalıcı anahtarla imzalı
# luna.apk (Hazal'ın tableti için) de çıkar; yoksa yalnızca luna-deneme.apk çıkar. Anahtar depoya asla girmez.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sürüm
        run: |
          V=$(node -e "const s=require('fs').readFileSync('js/surum.js','utf8');console.log(JSON.parse(s.match(/\/\*SURUMLER\*\/([\s\S]*?)\/\*SURUMLER\*\//)[1])[0].surum)")
          echo "LUNA_SURUM=$V" >> "$GITHUB_ENV"
          echo "LUNA_SURUM_KODU=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Luna'yı uygulamaya kopyala
        working-directory: apk
        run: |
          npm ci --no-audit --no-fund
          npm run sync
      - name: Derle
        working-directory: apk/android
        env:
          LUNA_IMZA_ANAHTARI: ${{ secrets.LUNA_IMZA_ANAHTARI }}
          LUNA_IMZA_SIFRESI: ${{ secrets.LUNA_IMZA_SIFRESI }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../cikti
          cp app/build/outputs/apk/debug/app-debug.apk ../../cikti/luna-deneme.apk
          if [ -n "$LUNA_IMZA_ANAHTARI" ] && [ -n "$LUNA_IMZA_SIFRESI" ]; then
            export LUNA_IMZA_DOSYASI="$RUNNER_TEMP/luna-imza.p12"
            printf '%s' "$LUNA_IMZA_ANAHTARI" | base64 -d > "$LUNA_IMZA_DOSYASI"
            ./gradlew --no-daemon assembleRelease
            rm -f "$LUNA_IMZA_DOSYASI"
            cp app/build/outputs/apk/release/app-release.apk ../../cikti/luna.apk
          else
            echo "İmza sırları yok: yalnızca deneme APK'sı çıktı"
          fi
          ls -la ../../cikti

      - name: Emülatöre izin (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç (telefon ve tablet)
        run: |
          SDK="$ANDROID_HOME"; export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n luna -k "system-images;android-35;google_apis;x86_64" -d pixel_6
          emulator -avd luna -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done
          adb install -r cikti/luna-deneme.apk
          adb logcat -c
          adb shell am start -n com.hazal.luna/.MainActivity
          sleep 35
          adb exec-out screencap -p > cikti/ekran-telefon.png
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb shell wm size 2560x1600
          adb shell wm density 320
          adb shell am force-stop com.hazal.luna
          adb shell am start -n com.hazal.luna/.MainActivity
          sleep 35
          adb exec-out screencap -p > cikti/ekran-tablet.png
          adb logcat -d > cikti/gunluk.txt
          echo "== Luna'nın günlüğü (konsol ve hatalar)"
          grep -E "Capacitor/Console|Luna APK|AndroidRuntime|FATAL" cikti/gunluk.txt | tail -120 || true
      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: luna-apk
          path: cikti/
      - name: "Sürüm sayfasına koy (apk-son)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          NOT="Luna $LUNA_SURUM · derleme $LUNA_SURUM_KODU · $(git log -1 --format=%h)
          luna-deneme.apk: deneme anahtarıyla imzalı; Hazal'ın tabletine kurulmaz.
          luna.apk: kalıcı anahtarla imzalı (varsa); Hazal'ın tableti için."
          gh release create apk-son cikti/*.apk cikti/ekran-*.png --prerelease --target "$GITHUB_SHA" --title "Luna APK $LUNA_SURUM (derleme $LUNA_SURUM_KODU)" --notes "$NOT"
