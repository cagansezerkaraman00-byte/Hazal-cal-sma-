# Her gönderimden sonra GitHub Pages yayınını yeniler: Hazal'ın telefonundaki Luna yeni sürümü
# görür ve "Güncelleme hazır" der. (Pages kapalıysa yalnızca bir not bırakır.)
name: Yayını yenile

on:
  push:
  workflow_dispatch:

permissions:
  pages: write

concurrency:
  group: pages-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pages durumu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '"kaynak: \(.build_type) \(.source.branch // "-") \(.source.path // "") · durum: \(.status // "-") · adres: \(.html_url)"' || echo "Pages ayarı okunamadı"
          gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"son yayın: \(.status) \(.commit[0:7]) \(.created_at)"' || true
      - name: Pages yayını iste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api -X POST "repos/${{ github.repository }}/pages/builds" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "does not have a GitHub Pages site"; then
            echo "::notice::GitHub Pages kapalı. Settings → Pages → Deploy from a branch ile açılınca her güncellemede yayın yenilenir."
          else
            echo "$out"; exit 1
          fi
