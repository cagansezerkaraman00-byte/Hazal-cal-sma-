# Her gönderimden sonra GitHub Pages'in hangi daldan yayın yaptığını ve son yayının durumunu yazar.
# Yayını GitHub kendisi yapar (Settings → Pages → Deploy from a branch); burada ayrıca yayın istemek
# GitHub'ın başlattığı yayını iptal ettirip yeniden kuyruğa sokuyordu.
name: Yayın durumu

on:
  push:
  workflow_dispatch:

permissions:
  pages: read

concurrency:
  group: pages-refresh
  cancel-in-progress: true

jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - name: Pages durumu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '"kaynak: \(.build_type) \(.source.branch // "-") \(.source.path // "") · durum: \(.status // "-") · adres: \(.html_url)"' || echo "Pages ayarı okunamadı"
          gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"son yayın: \(.status) \(.commit[0:7]) \(.created_at)"' || true
