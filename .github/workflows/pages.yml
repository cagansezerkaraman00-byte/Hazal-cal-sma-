# Uygulamaya gelen her güncellemede GitHub Pages yayınını yeniler
# (Pages "Deploy from a branch" ile bu daldan yayınlanıyor; bot gönderimleri yayını kendiliğinden başlatmıyor).
name: Yayını yenile

on:
  push:
    branches: [claude/luna-study-app-1xt2uk]
  workflow_dispatch:

permissions:
  pages: write

concurrency:
  group: pages-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pages yayını iste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api -X POST "repos/${{ github.repository }}/pages/builds" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "does not have a GitHub Pages site"; then
            echo "::notice::GitHub Pages kapalı. Settings → Pages → Deploy from a branch → claude/luna-study-app-1xt2uk, / (root) seçilince her güncellemede yayın yenilenir."
          else
            echo "$out"; exit 1
          fi
